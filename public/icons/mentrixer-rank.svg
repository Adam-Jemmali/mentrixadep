<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 25 260 260" role="img" aria-label="Mentrixer rank">
<defs>
  <filter id="glow-wide" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
  </filter>
  <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
  </filter>
</defs>

<g transform="translate(340,155)" fill="none" stroke="#D4A017">

  <!-- ================================================
       GOLDEN RADIANCE  (3 concentric layers)
       The only warm glow in the entire rank system.
       Every other badge is cold blue/violet.
       This is the signal.
       ================================================ -->
  <circle r="74" fill="#D4A017" fill-opacity="0.92" stroke="none" filter="url(#glow-wide)"/>
  <circle r="52" fill="#D4A017" fill-opacity="0.92" stroke="none" filter="url(#glow-core)"/>
  <circle r="30" fill="#D4A017" fill-opacity="0.92" stroke="none" filter="url(#glow-core)"/>

  <!-- ================================================
       FRAME  (6 rings — maximum in the ladder)
       Triple outer band + double inner + dashed deco
       ================================================ -->
  <circle r="100" stroke-width="3.5" stroke-opacity="0.96"/>
  <circle r="96" stroke-width="3.25" stroke-opacity="0.95"/>
  <circle r="92" stroke-width="3.25" stroke-opacity="0.95"/>
  <circle r="74" stroke-width="2.75" stroke-opacity="0.85"/>
  <circle r="68" stroke-width="2.75" stroke-opacity="0.8"/>
  <circle r="62" stroke-width="2.75" stroke-opacity="0.95" stroke-dasharray="8,3"/>

  <!-- ================================================
       TICKS  (cardinal + ordinal, boldest in ladder)
       ================================================ -->
  <line x1="0" y1="-100" x2="0" y2="-82" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="100" y1="0" x2="82" y2="0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="0" y1="100" x2="0" y2="82" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="-100" y1="0" x2="-82" y2="0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="71" y1="-71" x2="63" y2="-63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="71" y1="71" x2="63" y2="63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="-71" y1="71" x2="-63" y2="63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="-71" y1="-71" x2="-63" y2="-63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- ================================================
       CARDINAL GEM ORNAMENTS
       ================================================ -->
  <polygon points="0,-106 5,-98 0,-90 -5,-98" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.75" stroke-opacity="0.85"/>
  <polygon points="106,0 98,5 90,0 98,-5" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.75" stroke-opacity="0.85"/>
  <polygon points="0,106 5,98 0,90 -5,98" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.75" stroke-opacity="0.85"/>
  <polygon points="-106,0 -98,5 -90,0 -98,-5" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.75" stroke-opacity="0.85"/>

  <!-- ORDINAL DIAMONDS -->
  <polygon points="69,-69 72,-67 69,-65 66,-67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>
  <polygon points="69,69 72,67 69,65 66,67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>
  <polygon points="-69,69 -72,67 -69,65 -66,67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>
  <polygon points="-69,-69 -72,-67 -69,-65 -66,-67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>

  <!-- ================================================
       CROWN  (filled gold silhouette)
       5 points. Center dramatically tallest.
       Sides angle outward — proper regal shape,
       not the rectangular walls of a bad icon.
       ================================================ -->
  <polygon
    points="
      -48,28
      -42,0
      -32,16
      -20,-20
      -10,4
      0,-44
      10,4
      20,-20
      32,16
      42,0
      48,28
    "
    fill="#D4A017" fill-opacity="0.88"
    stroke="#D4A017" stroke-width="2.75"
    stroke-linejoin="round" stroke-opacity="0.9"
  />

  <!-- Crown edge highlight (inset outline for depth) -->
  <polygon
    points="
      -44,26
      -39,4
      -30,17
      -19,-16
      -9,6
      0,-40
      9,6
      19,-16
      30,17
      39,4
      44,26
    "
    fill="none"
    stroke="#F5D76E" stroke-width="0.75"
    stroke-linejoin="round" stroke-opacity="0.85"
  />

  <!-- ================================================
       HEADBAND  (proper band, not a line)
       ================================================ -->
  <rect x="-48" y="28" width="96" height="8" rx="2"
    fill="#D4A017" fill-opacity="0.92" stroke="none"/>

  <!-- Headband studs -->
  <circle cx="-24" cy="32" r="1.8" fill="#F5D76E" fill-opacity="0.92" stroke="none"/>
  <polygon points="0,29.5 3,32 0,34.5 -3,32" fill="#F5D76E" fill-opacity="0.95" stroke="none"/>
  <circle cx="24" cy="32" r="1.8" fill="#F5D76E" fill-opacity="0.92" stroke="none"/>

  <!-- ================================================
       GEM  (highlight gold — brighter than the crown)
       Sits on the center tip. Faceted diamond.
       The single brightest element in the badge.
       ================================================ -->
  <polygon
    points="0,-58 9,-50 0,-42 -9,-50"
    fill="#F5D76E" fill-opacity="1"
    stroke="#D4A017" stroke-width="2.75"
    stroke-linejoin="round" stroke-opacity="0.95"
  />
  <!-- Girdle -->
  <line x1="-9" y1="-50" x2="9" y2="-50" stroke-width="2.75" stroke-opacity="0.85"/>
  <!-- Facet lines -->
  <line x1="-4" y1="-54" x2="0" y2="-50" stroke-width="0.75" stroke-opacity="0.95"/>
  <line x1="4" y1="-54" x2="0" y2="-50" stroke-width="0.75" stroke-opacity="0.95"/>

</g>
</svg>
