<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 25 260 260" role="img" aria-label="Scholar rank">
<g transform="translate(340,155)" fill="none" stroke="#38BDF8">

  <!-- Frame: outer ring thickens, inner ring bolder -->
  <circle r="96" stroke-width="2.5" stroke-opacity="0.42"/>
  <circle r="76" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Cardinal ticks -->
  <line x1="0" y1="-96" x2="0" y2="-82" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="96" y1="0" x2="82" y2="0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="0" y1="96" x2="0" y2="82" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="-96" y1="0" x2="-82" y2="0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Ordinal ticks -->
  <line x1="68" y1="-68" x2="61" y2="-61" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>
  <line x1="68" y1="68" x2="61" y2="61" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>
  <line x1="-68" y1="68" x2="-61" y2="61" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>
  <line x1="-68" y1="-68" x2="-61" y2="-61" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.3"/>

  <!-- Open book: left page -->
  <path d="M0,14 C-12,10 -28,9 -42,11 L-42,38 C-28,36 -12,37 0,41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <!-- Right page -->
  <path d="M0,14 C12,10 28,9 42,11 L42,38 C28,36 12,37 0,41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
  <!-- Spine -->
  <line x1="0" y1="14" x2="0" y2="41" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Upward arrow from spine -->
  <line x1="0" y1="10" x2="0" y2="-52" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <polyline points="-10,-40 0,-52 10,-40" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85" fill="none"/>

  <!-- Arrow tip emphasis (filled triangle) -->
  <polygon points="0,-56 -6,-44 6,-44" fill="#38BDF8" fill-opacity="0.5" stroke="none"/>

</g>
</svg>
