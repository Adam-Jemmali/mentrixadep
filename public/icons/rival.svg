<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 25 260 260" role="img" aria-label="Rival rank">
<g transform="translate(340,155)" fill="none" stroke="#4F46E5">

  <!-- Frame: DOUBLE outer ring band (new at rank 5) + inner ring -->
  <circle r="98" stroke-width="3.25" stroke-opacity="0.95"/>
  <circle r="92" stroke-width="3.25" stroke-opacity="0.95"/>
  <circle r="72" stroke-width="2.75" stroke-opacity="0.95"/>

  <!-- Cardinal ticks (longer, bolder) -->
  <line x1="0" y1="-98" x2="0" y2="-82" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.96"/>
  <line x1="98" y1="0" x2="82" y2="0" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.96"/>
  <line x1="0" y1="98" x2="0" y2="82" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.96"/>
  <line x1="-98" y1="0" x2="-82" y2="0" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.96"/>

  <!-- Ordinal ticks -->
  <line x1="69" y1="-69" x2="62" y2="-62" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="69" y1="69" x2="62" y2="62" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="-69" y1="69" x2="-62" y2="62" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="-69" y1="-69" x2="-62" y2="-62" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Cardinal dots (carried from Contender) -->
  <circle cx="0" cy="-95" r="3" fill="#4F46E5" fill-opacity="0.95" stroke="none"/>
  <circle cx="95" cy="0" r="3" fill="#4F46E5" fill-opacity="0.95" stroke="none"/>
  <circle cx="0" cy="95" r="3" fill="#4F46E5" fill-opacity="0.95" stroke="none"/>
  <circle cx="-95" cy="0" r="3" fill="#4F46E5" fill-opacity="0.95" stroke="none"/>

  <!-- NEW: Ordinal dots (4 more dots at 45deg positions) -->
  <circle cx="67" cy="-67" r="2.5" fill="#4F46E5" fill-opacity="0.92" stroke="none"/>
  <circle cx="67" cy="67" r="2.5" fill="#4F46E5" fill-opacity="0.92" stroke="none"/>
  <circle cx="-67" cy="67" r="2.5" fill="#4F46E5" fill-opacity="0.92" stroke="none"/>
  <circle cx="-67" cy="-67" r="2.5" fill="#4F46E5" fill-opacity="0.92" stroke="none"/>

  <!-- Crossed lightning bolts forming an X -->
  <!-- Bolt: top-left to bottom-right -->
  <polyline points="-38,-48 -4,-6 -14,4 38,48" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" stroke-opacity="0.9"/>
  <!-- Bolt: top-right to bottom-left (perfect mirror) -->
  <polyline points="38,-48 4,-6 14,4 -38,48" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter" stroke-opacity="0.9"/>

  <!-- Collision spark at center (filled) -->
  <polygon points="0,-8 3,-2 8,0 3,2 0,8 -3,2 -8,0 -3,-2" fill="#4F46E5" fill-opacity="0.98" stroke="none"/>

</g>
</svg>
