<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 25 260 260" role="img" aria-label="Elite Guide rank">
<defs>
  <filter id="elite-glow-wide" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
  </filter>
  <filter id="elite-glow-core" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
  </filter>
</defs>

<g transform="translate(340,155)" fill="none" stroke="#D4A017">

  <!-- Golden radiance (same three layers as Mentrixer) -->
  <circle r="74" fill="#D4A017" fill-opacity="0.06" stroke="none" filter="url(#elite-glow-wide)"/>
  <circle r="52" fill="#D4A017" fill-opacity="0.09" stroke="none" filter="url(#elite-glow-core)"/>
  <circle r="30" fill="#D4A017" fill-opacity="0.05" stroke="none" filter="url(#elite-glow-core)"/>

  <!-- Frame: six gold rings (same ladder peak as Mentrixer) -->
  <circle r="100" stroke-width="2.5" stroke-opacity="0.96"/>
  <circle r="96" stroke-width="3.25" stroke-opacity="0.48"/>
  <circle r="92" stroke-width="3.25" stroke-opacity="0.38"/>
  <circle r="74" stroke-width="2.75" stroke-opacity="0.85"/>
  <circle r="68" stroke-width="2.25" stroke-opacity="0.8"/>
  <circle r="62" stroke-width="2.25" stroke-opacity="0.22" stroke-dasharray="8,3"/>

  <!-- Cardinal ticks -->
  <line x1="0" y1="-100" x2="0" y2="-82" stroke-width="3" stroke-linecap="round" stroke-opacity="0.97"/>
  <line x1="100" y1="0" x2="82" y2="0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.97"/>
  <line x1="0" y1="100" x2="0" y2="82" stroke-width="3" stroke-linecap="round" stroke-opacity="0.97"/>
  <line x1="-100" y1="0" x2="-82" y2="0" stroke-width="3" stroke-linecap="round" stroke-opacity="0.97"/>

  <!-- Ordinal ticks -->
  <line x1="71" y1="-71" x2="63" y2="-63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="71" y1="71" x2="63" y2="63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="-71" y1="71" x2="-63" y2="63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>
  <line x1="-71" y1="-71" x2="-63" y2="-63" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Cardinal gem ornaments -->
  <polygon points="0,-106 5,-98 0,-90 -5,-98" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.25" stroke-opacity="0.85"/>
  <polygon points="106,0 98,5 90,0 98,-5" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.25" stroke-opacity="0.85"/>
  <polygon points="0,106 5,98 0,90 -5,98" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.25" stroke-opacity="0.85"/>
  <polygon points="-106,0 -98,5 -90,0 -98,-5" fill="#D4A017" fill-opacity="0.96" stroke="#D4A017" stroke-width="2.25" stroke-opacity="0.85"/>

  <!-- Ordinal diamonds -->
  <polygon points="69,-69 72,-67 69,-65 66,-67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>
  <polygon points="69,69 72,67 69,65 66,67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>
  <polygon points="-69,69 -72,67 -69,65 -66,67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>
  <polygon points="-69,-69 -72,-67 -69,-65 -66,-67" fill="#D4A017" fill-opacity="0.92" stroke="none"/>

  <!-- Impact halo rings (Guide identity: movement proof, not crown) -->
  <circle r="38" stroke="#D4A017" stroke-width="3.25" stroke-opacity="0.95"/>
  <circle r="26" stroke="#D4A017" stroke-width="2.75" stroke-opacity="0.9"/>
  <circle r="14" stroke="#D4A017" stroke-width="2.25" stroke-opacity="0.88"/>

  <!-- Upward impact arrow (filled gold silhouette) -->
  <polygon
    points="0,-40 10,-8 5,-8 5,24 -5,24 -5,-8 -10,-8"
    fill="#D4A017" fill-opacity="0.88"
    stroke="#D4A017" stroke-width="2.75"
    stroke-linejoin="round" stroke-opacity="0.9"
  />

  <!-- Arrow highlight (inset outline, same as Mentrixer crown edge) -->
  <polygon
    points="0,-36 7,-10 3,-10 3,20 -3,20 -3,-10 -7,-10"
    fill="none"
    stroke="#F5D76E" stroke-width="0.75"
    stroke-linejoin="round" stroke-opacity="0.85"
  />

  <!-- Impact base band -->
  <rect x="-12" y="24" width="24" height="6" rx="2"
    fill="#D4A017" fill-opacity="0.72" stroke="none"/>

  <!-- Base studs -->
  <circle cx="-6" cy="27" r="1.5" fill="#F5D76E" fill-opacity="0.92" stroke="none"/>
  <circle cx="6" cy="27" r="1.5" fill="#F5D76E" fill-opacity="0.92" stroke="none"/>

  <!-- Impact gem (brightest element, faceted diamond at arrow tip) -->
  <polygon
    points="0,-52 9,-44 0,-36 -9,-44"
    fill="#F5D76E" fill-opacity="1"
    stroke="#D4A017" stroke-width="2.75"
    stroke-linejoin="round" stroke-opacity="0.95"
  />
  <line x1="-9" y1="-44" x2="9" y2="-44" stroke="#D4A017" stroke-width="2.25" stroke-opacity="0.85"/>
  <line x1="-4" y1="-48" x2="0" y2="-44" stroke="#D4A017" stroke-width="0.75" stroke-opacity="0.85"/>
  <line x1="4" y1="-48" x2="0" y2="-44" stroke="#D4A017" stroke-width="0.75" stroke-opacity="0.85"/>

</g>
</svg>
