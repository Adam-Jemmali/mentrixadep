<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 25 260 260" role="img" aria-label="Specialist Guide rank">
<g transform="translate(340,155)" fill="none" stroke="#2563EB">

  <!-- Frame: bolder rings -->
  <circle r="96" stroke-width="2.5" stroke-opacity="0.48"/>
  <circle r="78" stroke-width="2.75" stroke-opacity="0.28"/>

  <!-- Cardinal ticks -->
  <line x1="0" y1="-96" x2="0" y2="-82" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="96" y1="0" x2="82" y2="0" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="0" y1="96" x2="0" y2="82" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.95"/>
  <line x1="-96" y1="0" x2="-82" y2="0" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Ordinal ticks -->
  <line x1="68" y1="-68" x2="61" y2="-61" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.32"/>
  <line x1="68" y1="68" x2="61" y2="61" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.32"/>
  <line x1="-68" y1="68" x2="-61" y2="61" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.32"/>
  <line x1="-68" y1="-68" x2="-61" y2="-61" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.32"/>

  <!-- Cardinal dot ornaments -->
  <circle cx="0" cy="-96" r="3" fill="#2563EB" fill-opacity="0.92" stroke="none"/>
  <circle cx="96" cy="0" r="3" fill="#2563EB" fill-opacity="0.92" stroke="none"/>
  <circle cx="0" cy="96" r="3" fill="#2563EB" fill-opacity="0.92" stroke="none"/>
  <circle cx="-96" cy="0" r="3" fill="#2563EB" fill-opacity="0.92" stroke="none"/>

  <!-- Focused beam: cone from apex to focal point -->
  <polygon points="0,-58 -28,32 28,32" fill="#2563EB" fill-opacity="0.12" stroke="none"/>
  <line x1="0" y1="-58" x2="-28" y2="32" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.98"/>
  <line x1="0" y1="-58" x2="28" y2="32" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.98"/>
  <line x1="-28" y1="32" x2="28" y2="32" stroke-width="3.25" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Focal lens -->
  <circle cx="0" cy="32" r="10" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle cx="0" cy="32" r="4" fill="#2563EB" fill-opacity="0.98" stroke="none"/>

  <!-- Beam axis -->
  <line x1="0" y1="-58" x2="0" y2="22" stroke-width="2.75" stroke-linecap="round" stroke-opacity="0.9" stroke-dasharray="4,3"/>

</g>
</svg>
