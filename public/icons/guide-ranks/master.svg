<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 25 260 260" role="img" aria-label="Master Guide rank">
<defs>
  <filter id="master-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
  </filter>
</defs>

<g transform="translate(340,155)" fill="none" stroke="#7C3AED">

  <!-- Subtle violet glow -->
  <circle r="52" fill="#7C3AED" fill-opacity="0.08" stroke="none" filter="url(#master-glow)"/>

  <!-- Frame: double outer + dashed deco -->
  <circle r="98" stroke-width="2" stroke-opacity="0.52"/>
  <circle r="92" stroke-width="2" stroke-opacity="0.4"/>
  <circle r="74" stroke-width="1.5" stroke-opacity="0.28"/>
  <circle r="64" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6,4"/>

  <!-- Cardinal ticks -->
  <line x1="0" y1="-98" x2="0" y2="-82" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="98" y1="0" x2="82" y2="0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="0" y1="98" x2="0" y2="82" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="-98" y1="0" x2="-82" y2="0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Ordinal ticks -->
  <line x1="69" y1="-69" x2="62" y2="-62" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="69" y1="69" x2="62" y2="62" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="-69" y1="69" x2="-62" y2="62" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>
  <line x1="-69" y1="-69" x2="-62" y2="-62" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35"/>

  <!-- Cardinal diamond ornaments -->
  <polygon points="0,-100 4,-95 0,-90 -4,-95" fill="#7C3AED" fill-opacity="0.55" stroke="none"/>
  <polygon points="100,0 95,4 90,0 95,-4" fill="#7C3AED" fill-opacity="0.55" stroke="none"/>
  <polygon points="0,100 4,95 0,90 -4,95" fill="#7C3AED" fill-opacity="0.55" stroke="none"/>
  <polygon points="-100,0 -95,4 -90,0 -95,-4" fill="#7C3AED" fill-opacity="0.55" stroke="none"/>

  <!-- Mastery seal: wax disc -->
  <circle r="34" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle r="28" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,2"/>

  <!-- Ribbon tails -->
  <path d="M-18,30 L-28,48 L-14,38 Z" fill="#7C3AED" fill-opacity="0.5" stroke="none"/>
  <path d="M18,30 L28,48 L14,38 Z" fill="#7C3AED" fill-opacity="0.5" stroke="none"/>

  <!-- Seal star (mastery mark) -->
  <polygon points="0,-18 4.5,-6 17,-6 7,2 11,14 0,7 -11,14 -7,2 -17,-6 -4.5,-6" fill="#7C3AED" fill-opacity="0.85" stroke="none"/>

</g>
</svg>
