  <circle cx="-14" cy="124" r="7" fill="#0D1B2A"/>
  <circle cx="14" cy="124" r="7" fill="#0D1B2A"/>
  <circle cx="-14" cy="124" r="5" fill="#1565C0"/>
  <circle cx="14" cy="124" r="5" fill="#1565C0"/>
  <circle cx="-14" cy="124" r="3" fill="#0D1B2A"/>
  <circle cx="14" cy="124" r="3" fill="#0D1B2A"/>
  <circle cx="-11" cy="122" r="1.5" fill="white"/>
  <circle cx="17" cy="122" r="1.5" fill="white"/>

