  <path d="M-22 113 Q-14 108 -6 111" stroke="#1A0A00" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M6 111 Q14 108 22 113" stroke="#1A0A00" stroke-width="2.5" fill="none" stroke-linecap="round"/>

