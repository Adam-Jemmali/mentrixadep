  <g transform="translate(52,76)">
    <rect x="-18" y="-14" width="36" height="26" rx="6" fill="#FFD600"/>
    <rect x="-18" y="-14" width="36" height="26" rx="6" fill="none" stroke="#F9A825" stroke-width="1.5"/>
    <polygon points="0,-8 2,-3 8,-3 3,0 5,6 0,2 -5,6 -3,0 -8,-3 -2,-3" fill="#3E2000"/>
