  <circle cx="0" cy="56" r="12" fill="#0D47A1" opacity="0.7"/>
  <polygon points="0,48 2,53 7,53 3,56 5,62 0,58 -5,62 -3,56 -7,53 -2,53" fill="#64FFDA" opacity="0.9"/>

