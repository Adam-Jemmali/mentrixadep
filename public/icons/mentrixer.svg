  <circle cx="-10" cy="226" r="3" fill="#29B6F6"/>
  <circle cx="10" cy="226" r="3" fill="#29B6F6"/>

  <!-- left arm + book -->
  <rect x="-68" y="190" width="28" height="90" rx="12" fill="#1565C0"/>
  <rect x="-72" y="270" width="24" height="18" rx="6" fill="#1A237E"/>
  <rect x="-90" y="255" width="32" height="44" rx="5" fill="#29B6F6"/>
  <rect x="-74" y="255" width="2" height="44" fill="#0D47A1"/>
  <rect x="-88" y="263" width="26" height="2" rx="1" fill="#0D47A1" opacity="0.6"/>
  <rect x="-88" y="270" width="20" height="2" rx="1" fill="#0D47A1" opacity="0.6"/>
  <rect x="-88" y="277" width="24" height="2" rx="1" fill="#0D47A1" opacity="0.6"/>
  <rect x="-88" y="284" width="16" height="2" rx="1" fill="#0D47A1" opacity="0.6"/>
  <rect x="-90" y="255" width="6" height="44" rx="3" fill="#64FFDA" opacity="0.4"/>

