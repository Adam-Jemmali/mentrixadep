  <g transform="translate(56,74)">
    <rect x="-12" y="-20" width="24" height="30" rx="5" fill="#FF8F00"/>
    <rect x="-12" y="-20" width="24" height="30" rx="5" fill="none" stroke="#E65100" stroke-width="1.5"/>
    <rect x="-8" y="-26" width="16" height="8" rx="3" fill="#E65100"/>
    <rect x="-3" y="-30" width="6" height="6" rx="2" fill="#BF360C"/>
    <line x1="-8" y1="-8" x2="-8" y2="8" stroke="#E65100" stroke-width="1.2"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#E65100" stroke-width="1.2"/>
    <line x1="8" y1="-8" x2="8" y2="8" stroke="#E65100" stroke-width="1.2"/>
    <ellipse cx="0" cy="14" rx="8" ry="4" fill="#FFD600" opacity="0.5"/>
    <ellipse cx="0" cy="14" rx="5" ry="3" fill="#FFEB3B" opacity="0.4"/>
  </g>

  <!-- guide badge (star shape only, no text) -->
  <g transform="translate(-56,72)">
    <rect x="-20" y="-14" width="40" height="26" rx="6" fill="#1565C0"/>
    <rect x="-20" y="-14" width="40" height="26" rx="6" fill="none" stroke="#42A5F5" stroke-width="1.5"/>
    <polygon points="0,-8 2.5,-2 8,-2 3.5,2 5.5,8 0,4 -5.5,8 -3.5,2 -8,-2 -2.5,-2" fill="#E3F2FD"/>
  </g>

  <!-- progress node map -->
  <g transform="translate(0,48)" opacity="0.85">
    <circle cx="-24" cy="0" r="5" fill="#4CAF50"/>
    <circle cx="0" cy="0" r="5" fill="#4CAF50"/>
    <circle cx="24" cy="0" r="4" fill="#FF8F00"/>
    <circle cx="44" cy="0" r="3" fill="#546E7A"/>
    <line x1="-19" y1="0" x2="-5" y2="0" stroke="#4CAF50" stroke-width="1.5"/>
    <line x1="5" y1="0" x2="20" y2="0" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="28" y1="0" x2="41" y2="0" stroke="#546E7A" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

</g>
</svg>
