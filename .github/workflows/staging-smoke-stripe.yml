name: Staging Stripe Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 */5 * *"

jobs:
  stripe-success-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_APP_URL }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      E2E_STUDENT_ID: ${{ secrets.E2E_STUDENT_ID }}
      E2E_TUTOR_ID: ${{ secrets.E2E_TUTOR_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run staging Stripe success-path smoke
        run: npx playwright test -c playwright.staging.config.ts --reporter=line

      - name: Upload staging smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-stripe-smoke-results
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
