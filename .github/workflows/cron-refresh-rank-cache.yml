# Rank cache refresh runs every 5 minutes (Vercel Hobby cannot schedule sub-daily crons).
# Also available manually: Actions → Cron Refresh Rank Cache → Run workflow.
#
# Required repository secret: CRON_SECRET (must match Vercel/production CRON_SECRET exactly)
# Optional variable: PLAYWRIGHT_BASE_URL (defaults to https://mentrixa.one)

name: Cron Refresh Rank Cache

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh-rank-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger /api/cron/refresh-rank-cache
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
        run: bash scripts/github-cron-ping.sh /api/cron/refresh-rank-cache
