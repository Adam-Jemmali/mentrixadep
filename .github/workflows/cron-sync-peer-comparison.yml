# Vercel Hobby only allows cron expressions that run once per day (vercel.json).
# Hourly peer comparison sync runs here instead of vercel.json.
#
# Required repository secret: CRON_SECRET
# Optional variable: PLAYWRIGHT_BASE_URL (defaults to https://mentrixa.one)

name: Cron Sync Peer Comparison

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  sync-peer-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/sync-peer-comparison
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set — add it under repository secrets."
            exit 1
          fi
          BASE_URL="${{ vars.PLAYWRIGHT_BASE_URL || 'https://mentrixa.one' }}"
          URL="${BASE_URL%/}/api/cron/sync-peer-comparison"
          echo "Pinging ${URL}"
          code=$(curl -sS -o /tmp/cron-body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}")
          echo "HTTP ${code}"
          cat /tmp/cron-body.txt
          test "${code}" -ge 200 && test "${code}" -lt 300
