# Lint, unit tests, and production build on every push / PR.
# Set repository secrets if your build requires additional env vars.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Placeholders so Next.js and env getters can resolve during `next build`
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-supabase-service-role-placeholder
      NEXT_PUBLIC_APP_URL: https://placeholder.example
      CRON_SECRET: ci-cron-secret-placeholder
      CRON_ALLOWED_IPS: "127.0.0.1"
      GEMINI_API_KEY: ci-gemini-placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      RESEND_API_KEY: re_placeholder
      WAITLIST_ENABLED: "false"
      # Optional: real tutor UUID for booking smoke test (repository variable / secret)
      # E2E_TUTOR_ID: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit (critical only; see .npmrc audit-level)
        run: npm run audit:ci

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e:ci
        env:
          E2E_TUTOR_ID: ${{ secrets.E2E_TUTOR_ID }}

  load-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: k6 smoke (health endpoint)
        run: k6 run load-tests/smoke.js
        env:
          BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://mentrixa.one' }}
