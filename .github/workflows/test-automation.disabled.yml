name: Mentrixa Test Automation

on:
  schedule:
    # Example: Run every weekday at 9 AM, 1 PM, and 6 PM UTC
    # Adjust the cron expressions to the specific hours you want
    - cron: '0 9 * * 1-5'
    - cron: '0 13 * * 1-5'
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from GitHub UI
    inputs:
      hourOffset:
        description: 'Hours from now to schedule (0 = next hour)'
        required: false
        default: '0'

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Test Session Automation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          HOUR_OFFSET: ${{ github.event.inputs.hourOffset || '0' }}
        run: |
          curl -f -X GET "${SITE_URL}/api/cron/test-session-automation?hourOffset=${HOUR_OFFSET}" \
            -H "Authorization: Bearer ${CRON_SECRET}"
