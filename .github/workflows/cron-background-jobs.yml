# Background job worker cannot run more than once/day on Vercel Hobby, so it is scheduled
# in vercel.json. Use this workflow only when you need a manual drain (Actions → Run workflow).
#
# Required repository secret: CRON_SECRET
# Optional variable: PLAYWRIGHT_BASE_URL (defaults to https://mentrixa.one)

name: Cron Background Jobs

on:
  workflow_dispatch:

jobs:
  process-background-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/process-background-jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set — add it under repository secrets to run this workflow."
            exit 1
          fi
          BASE_URL="${{ vars.PLAYWRIGHT_BASE_URL || 'https://mentrixa.one' }}"
          URL="${BASE_URL%/}/api/cron/process-background-jobs"
          echo "Pinging ${URL}"
          code=$(curl -sS -o /tmp/cron-body.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${URL}")
          echo "HTTP ${code}"
          cat /tmp/cron-body.txt
          test "${code}" -ge 200 && test "${code}" -lt 300
